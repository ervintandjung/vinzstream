<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VinzStream - Nonton Donghua & Anime Sub Indo</title>
<meta name="description" content="VinzStream - Nonton donghua dan anime terlengkap dengan subtitle Indonesia. Update otomatis setiap hari.">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<style>
:root{--bg-base:#0a0c12;--bg-card:#111520;--bg-elevated:#161b2e;--blue-primary:#2563eb;--blue-bright:#3b82f6;--blue-glow:#60a5fa;--blue-dim:#1e3a6e;--text-primary:#f0f4ff;--text-secondary:#8899bb;--text-muted:#4a5878;--border:#1e2a42;--red:#ef4444;--green:#22c55e;--yellow:#facc15;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg-base);color:var(--text-primary);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden;}
a{color:inherit;}
nav{position:sticky;top:0;z-index:100;background:rgba(10,12,18,0.93);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;}
.nav-logo{font-family:'Rajdhani',sans-serif;font-size:1.6rem;font-weight:700;cursor:pointer;}
.nav-logo span{color:var(--blue-bright);}
.nav-links{display:flex;gap:24px;list-style:none;}
.nav-links a{color:var(--text-secondary);text-decoration:none;font-size:.88rem;font-weight:500;cursor:pointer;transition:color .2s;}
.nav-links a:hover,.nav-links a.active{color:var(--blue-glow);}
.nav-right{display:flex;gap:10px;align-items:center;}
.search-box{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:7px 14px;color:var(--text-primary);font-size:.85rem;width:200px;outline:none;transition:border-color .2s;}
.search-box:focus{border-color:var(--blue-primary);}
.search-box::placeholder{color:var(--text-muted);}
.hero{background:linear-gradient(135deg,#0d1b3e 0%,#0a0c12 70%);padding:60px 32px 48px;position:relative;overflow:hidden;}
.hero::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(37,99,235,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(37,99,235,.06) 1px,transparent 1px);background-size:40px 40px;}
.hero-inner{max-width:1280px;margin:0 auto;position:relative;z-index:1;}
.hero-eyebrow{font-size:.75rem;font-weight:600;color:var(--blue-glow);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px;}
.hero-title{font-family:'Rajdhani',sans-serif;font-size:3rem;font-weight:700;line-height:1.1;margin-bottom:14px;}
.hero-title span{color:var(--blue-bright);}
.hero-desc{color:var(--text-secondary);font-size:.95rem;line-height:1.6;margin-bottom:24px;max-width:500px;}
.hero-btns{display:flex;gap:12px;}
.btn-primary{background:var(--blue-primary);color:#fff;border:none;border-radius:10px;padding:12px 24px;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:8px;text-decoration:none;}
.btn-primary:hover{background:var(--blue-bright);transform:translateY(-1px);box-shadow:0 4px 20px rgba(37,99,235,.4);}
.btn-secondary{background:transparent;color:var(--text-primary);border:1px solid var(--border);border-radius:10px;padding:10px 18px;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .2s;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
.btn-secondary:hover{border-color:var(--blue-bright);color:var(--blue-glow);}
.stats-bar{background:var(--bg-elevated);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:18px 32px;}
.stats-inner{max-width:1280px;margin:0 auto;display:flex;justify-content:space-around;gap:20px;}
.stat-item{text-align:center;}
.stat-num{font-family:'Rajdhani',sans-serif;font-size:1.8rem;font-weight:700;color:var(--blue-bright);line-height:1;}
.stat-label{font-size:.75rem;color:var(--text-muted);margin-top:4px;}
.section{padding:36px 32px;max-width:1280px;margin:0 auto;}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.section-title{font-family:'Rajdhani',sans-serif;font-size:1.4rem;font-weight:700;display:flex;align-items:center;gap:10px;}
.section-title::before{content:'';width:4px;height:22px;background:var(--blue-bright);border-radius:2px;display:inline-block;}
.see-all{color:var(--blue-glow);font-size:.85rem;cursor:pointer;text-decoration:none;font-weight:500;}
.skeleton{background:var(--bg-card);border-radius:12px;overflow:hidden;border:1px solid var(--border);}
.skeleton-poster{aspect-ratio:2/3;background:linear-gradient(90deg,var(--bg-elevated) 25%,#1a2340 50%,var(--bg-elevated) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;}
.skeleton-line{height:12px;background:linear-gradient(90deg,var(--bg-elevated) 25%,#1a2340 50%,var(--bg-elevated) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:4px;margin:10px 10px 6px;}
.skeleton-line.short{width:60%;margin-bottom:10px;}
@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
.anime-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;}
.anime-card{background:var(--bg-card);border-radius:12px;overflow:hidden;border:1px solid var(--border);cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s;}
.anime-card:hover{transform:translateY(-4px);box-shadow:0 8px 32px rgba(37,99,235,.2);border-color:var(--blue-dim);}
.anime-poster{width:100%;aspect-ratio:2/3;background:var(--bg-elevated);position:relative;overflow:hidden;}
.anime-poster img{width:100%;height:100%;object-fit:cover;transition:transform .3s;}
.anime-card:hover .anime-poster img{transform:scale(1.05);}
.anime-poster-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,12,18,.95) 0%,transparent 50%);opacity:0;transition:opacity .2s;display:flex;align-items:center;justify-content:center;}
.anime-card:hover .anime-poster-overlay{opacity:1;}
.play-btn{width:44px;height:44px;background:var(--blue-primary);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;}
.card-badge{position:absolute;top:8px;right:8px;background:var(--blue-primary);color:#fff;font-size:.6rem;font-weight:700;padding:3px 7px;border-radius:5px;}
.card-badge.new{background:var(--green);}
.card-badge.hot{background:var(--red);}
.anime-info{padding:10px;}
.anime-title{font-size:.82rem;font-weight:600;color:var(--text-primary);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.anime-meta{font-size:.72rem;color:var(--text-muted);display:flex;justify-content:space-between;}
.anime-meta span{color:var(--blue-glow);}

/* ─── DETAIL PAGE ─── */
.detail-hero{position:relative;overflow:hidden;min-height:380px;}
.detail-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(24px) brightness(.35);transform:scale(1.1);}
.detail-bg-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(10,12,18,.4) 0%,rgba(10,12,18,.85) 65%,var(--bg-base) 100%);}
.detail-back{position:relative;z-index:2;padding:16px 32px 0;max-width:1280px;margin:0 auto;}
.back-btn{background:rgba(17,21,32,.85);border:1px solid var(--border);color:var(--text-primary);padding:8px 14px;border-radius:8px;font-size:.85rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;backdrop-filter:blur(8px);text-decoration:none;}
.back-btn:hover{border-color:var(--blue-bright);color:var(--blue-glow);}
.detail-inner{position:relative;z-index:2;max-width:1280px;margin:0 auto;padding:24px 32px 36px;display:flex;gap:28px;flex-wrap:wrap;}
.detail-poster{width:200px;flex-shrink:0;border-radius:14px;overflow:hidden;border:1px solid var(--border);box-shadow:0 12px 40px rgba(0,0,0,.6);background:var(--bg-elevated);}
.detail-poster img{width:100%;display:block;aspect-ratio:2/3;object-fit:cover;}
.detail-meta{flex:1;min-width:260px;}
.detail-eyebrow{font-size:.72rem;font-weight:600;color:var(--blue-glow);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;}
.detail-title{font-family:'Rajdhani',sans-serif;font-size:2.2rem;font-weight:700;line-height:1.1;margin-bottom:6px;}
.detail-subtitle{font-size:.95rem;color:var(--text-secondary);margin-bottom:14px;}
.detail-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.detail-tag{background:rgba(17,21,32,.7);border:1px solid var(--border);color:var(--text-secondary);padding:5px 12px;border-radius:20px;font-size:.74rem;backdrop-filter:blur(6px);}
.detail-tag.score{color:var(--yellow);border-color:rgba(250,204,21,.3);}
.detail-tag.status{color:var(--green);border-color:rgba(34,197,94,.3);}
.detail-desc{font-size:.9rem;color:var(--text-secondary);line-height:1.7;margin-bottom:16px;max-width:780px;}
.detail-desc-toggle{color:var(--blue-glow);font-size:.8rem;cursor:pointer;font-weight:500;}
.detail-actions{display:flex;gap:10px;flex-wrap:wrap;}

/* Player */
.player-section{max-width:1280px;margin:0 auto;padding:0 32px 24px;}
.ep-controls{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px;display:flex;align-items:center;flex-wrap:wrap;gap:12px;}
.ep-nav{display:flex;align-items:center;gap:6px;}
.ep-btn{background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-primary);width:32px;height:32px;border-radius:7px;cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.ep-btn:hover:not(:disabled){background:var(--blue-primary);border-color:var(--blue-primary);}
.ep-btn:disabled{opacity:.4;cursor:not-allowed;}
.ep-input{background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-primary);width:56px;height:32px;border-radius:7px;text-align:center;font-size:.85rem;font-weight:600;outline:none;}
.ep-input:focus{border-color:var(--blue-primary);}
.ep-total{font-size:.78rem;color:var(--text-muted);white-space:nowrap;}
.src-label{font-size:.72rem;color:var(--text-muted);font-weight:700;letter-spacing:.8px;white-space:nowrap;}
.src-btns{display:flex;gap:6px;flex-wrap:wrap;}
.src-btn{background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-secondary);padding:6px 12px;border-radius:7px;font-size:.74rem;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;}
.src-btn:hover{border-color:var(--blue-bright);color:var(--blue-glow);}
.src-btn.active{background:var(--blue-primary);border-color:var(--blue-primary);color:#fff;}
.src-btn .dot{width:6px;height:6px;border-radius:50%;background:var(--text-muted);}
.src-btn.active .dot{background:#fff;}
.src-btn.success .dot{background:var(--green);}
.src-btn.fail .dot{background:var(--red);}
.ep-spacer{flex:1;min-width:8px;}
.player-frame{width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;border:1px solid var(--border);position:relative;}
.player-frame iframe,.player-frame video{width:100%;height:100%;border:none;display:block;background:#000;}
.player-status{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--text-muted);font-size:.9rem;text-align:center;padding:20px;}
.player-status .icon{font-size:2.6rem;}
.player-status .spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--blue-bright);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.player-hint{font-size:.74rem;color:var(--text-muted);margin-top:10px;padding:0 4px;line-height:1.6;}
.player-hint .warn{color:var(--yellow);}

/* Episode grid */
.ep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:8px;margin-top:8px;}
.ep-cell{background:var(--bg-card);border:1px solid var(--border);color:var(--text-secondary);padding:10px 0;text-align:center;border-radius:8px;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .15s;}
.ep-cell:hover{border-color:var(--blue-bright);color:var(--blue-glow);}
.ep-cell.active{background:var(--blue-primary);border-color:var(--blue-primary);color:#fff;}

.schedule-tabs{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;padding-bottom:4px;}
.tab-btn{background:var(--bg-card);border:1px solid var(--border);color:var(--text-secondary);padding:8px 18px;border-radius:8px;font-size:.82rem;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .2s;}
.tab-btn.active,.tab-btn:hover{background:var(--blue-primary);border-color:var(--blue-primary);color:#fff;}
.schedule-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
.schedule-item{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:14px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:all .2s;}
.schedule-item:hover{border-color:var(--blue-dim);background:var(--bg-elevated);}
.sched-thumb{width:50px;height:70px;border-radius:6px;background:var(--bg-elevated);overflow:hidden;flex-shrink:0;}
.sched-thumb img{width:100%;height:100%;object-fit:cover;}
.sched-info{flex:1;min-width:0;}
.sched-title{font-size:.88rem;font-weight:600;color:var(--text-primary);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sched-ep{font-size:.78rem;color:var(--blue-glow);margin-bottom:4px;font-weight:500;}
.sched-time{font-size:.72rem;color:var(--text-muted);}
.sched-status{font-size:.68rem;font-weight:700;padding:3px 8px;border-radius:5px;flex-shrink:0;}
.sched-status.done{background:rgba(34,197,94,.1);color:var(--green);border:1px solid rgba(34,197,94,.2);}
.sched-status.soon{background:rgba(37,99,235,.15);color:var(--blue-glow);border:1px solid rgba(37,99,235,.3);}
.error-box{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:10px;padding:16px;color:var(--red);font-size:.85rem;text-align:center;}
footer{background:var(--bg-card);border-top:1px solid var(--border);padding:32px;text-align:center;}
.footer-logo{font-family:'Rajdhani',sans-serif;font-size:1.4rem;font-weight:700;margin-bottom:8px;}
.footer-logo span{color:var(--blue-bright);}
.footer-links{display:flex;justify-content:center;gap:20px;margin:14px 0;flex-wrap:wrap;}
.footer-links a{font-size:.8rem;color:var(--text-secondary);text-decoration:none;cursor:pointer;}
.footer-links a:hover{color:var(--blue-glow);}
.footer-text{font-size:.78rem;color:var(--text-muted);line-height:1.7;}
.divider{height:1px;background:var(--border);}
@media(max-width:768px){
  nav{padding:0 16px;}.nav-links{display:none;}.search-box{width:130px;}
  .hero{padding:40px 16px 36px;}.hero-title{font-size:2rem;}
  .section{padding:24px 16px;}.stats-inner{flex-wrap:wrap;}
  .hero-btns{flex-direction:column;}.hero-btns button{justify-content:center;}
  .detail-back{padding:12px 16px 0;}
  .detail-inner{padding:18px 16px 24px;gap:18px;}
  .detail-poster{width:130px;}
  .detail-title{font-size:1.6rem;}
  .detail-subtitle{font-size:.85rem;}
  .player-section{padding:0 16px 20px;}
  .ep-controls{padding:12px;gap:8px;}
  .ep-spacer{display:none;flex-basis:100%;}
  .src-label{flex-basis:100%;margin-top:4px;}
}
</style>
</head>
<body>

<nav>
  <div class="nav-logo" onclick="navHome()">Vinz<span>Stream</span></div>
  <ul class="nav-links">
    <li><a onclick="navHome()" class="active">Beranda</a></li>
    <li><a onclick="navHome('jadwal')">Jadwal</a></li>
    <li><a onclick="navHome('trending')">Trending</a></li>
    <li><a onclick="navHome('terbaru')">Terbaru</a></li>
  </ul>
  <div class="nav-right">
    <input class="search-box" type="text" id="searchInput" placeholder="🔍 Cari anime...">
  </div>
</nav>

<main id="view"></main>

<footer>
  <div class="footer-logo">Vinz<span>Stream</span></div>
  <div class="footer-links">
    <a>Tentang</a><a>Privasi</a><a>DMCA</a><a>Kontak</a>
  </div>
  <div class="footer-text">
    © 2026 VinzStream &nbsp;•&nbsp; Data otomatis dari <a href="https://anilist.co" style="color:var(--blue-glow)" target="_blank">AniList API</a><br>
    VinzStream tidak menyimpan video apapun di server kami.
  </div>
</footer>

<script>
/* =========================================================
   VinzStream v4 — Hash router + full-page detail + scraping
   ========================================================= */

const ANILIST = 'https://graphql.anilist.co';
const VIEW = document.getElementById('view');

/* ─── CORS proxy pool (untuk scraping cross-origin) ─── */
const PROXIES = [
  u => 'https://corsproxy.io/?' + encodeURIComponent(u),
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u),
];

async function proxiedFetch(url, opts = {}, timeoutMs = 9000) {
  let lastErr;
  for (const p of PROXIES) {
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), timeoutMs);
      const r = await fetch(p(url), { ...opts, signal: ctrl.signal });
      clearTimeout(t);
      if (!r.ok) { lastErr = new Error('HTTP ' + r.status); continue; }
      return r;
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('All proxies failed');
}

/* ─── AniList GraphQL ─── */
async function gql(query, variables) {
  try {
    const r = await fetch(ANILIST, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ query, variables })
    });
    const d = await r.json();
    return d.data;
  } catch (e) { return null; }
}

/* ─── State ─── */
let scheduleData = {};
let currentAnime = null;
let currentEp = 1;
let currentSource = 'auto';
let hls = null;

/* =========================================================
   HASH ROUTER
   ========================================================= */
function parseHash() {
  const h = location.hash.replace(/^#\/?/, '');
  if (!h) return { route: 'home' };
  if (h.startsWith('anime/')) return { route: 'anime', id: h.slice(6).split('?')[0] };
  if (h.startsWith('search')) {
    const q = h.split('?')[1] || '';
    const params = new URLSearchParams(q);
    return { route: 'search', q: params.get('q') || '' };
  }
  return { route: 'home' };
}

function render() {
  destroyPlayer();
  const r = parseHash();
  if (r.route === 'anime') return renderDetail(r.id);
  if (r.route === 'search') return renderSearch(r.q);
  return renderHome();
}

function navHome(anchor) {
  if (location.hash) { location.hash = ''; }
  else render();
  if (anchor) setTimeout(() => {
    const el = document.getElementById(anchor);
    if (el) el.scrollIntoView({ behavior: 'smooth' });
  }, 80);
}

window.addEventListener('hashchange', () => { window.scrollTo(0, 0); render(); });

/* =========================================================
   HOME PAGE
   ========================================================= */
function renderHome() {
  VIEW.innerHTML = `
    <section class="hero">
      <div class="hero-inner">
        <div class="hero-eyebrow">✦ Data Real-Time via AniList API — Auto Update Setiap Hari</div>
        <h1 class="hero-title">Nonton Donghua &<br><span>Anime</span> Sub Indo</h1>
        <p class="hero-desc">Ribuan judul tersedia dengan data otomatis sinkron setiap hari langsung dari database anime terbesar di dunia. Gratis, tanpa ribet.</p>
        <div class="hero-btns">
          <button class="btn-primary" onclick="document.getElementById('trending').scrollIntoView({behavior:'smooth'})">▶ Jelajahi Anime</button>
          <button class="btn-secondary" onclick="document.getElementById('jadwal').scrollIntoView({behavior:'smooth'})">📅 Jadwal Update</button>
        </div>
      </div>
    </section>
    <div class="stats-bar">
      <div class="stats-inner">
        <div class="stat-item"><div class="stat-num" id="statTotal">...</div><div class="stat-label">Judul Tersedia</div></div>
        <div class="stat-item"><div class="stat-num">Auto</div><div class="stat-label">Sinkron Data</div></div>
        <div class="stat-item"><div class="stat-num">AniList</div><div class="stat-label">Sumber API</div></div>
        <div class="stat-item"><div class="stat-num">HD</div><div class="stat-label">Kualitas Video</div></div>
      </div>
    </div>
    <div id="trending" class="section">
      <div class="section-header">
        <div class="section-title" id="trendingTitle">🔥 Trending Sekarang</div>
        <a class="see-all">Muat Lebih →</a>
      </div>
      <div id="trendingGrid" class="anime-grid">${skeletonCards(6)}</div>
    </div>
    <div class="divider"></div>
    <div id="terbaru" class="section">
      <div class="section-header">
        <div class="section-title">🆕 Episode Terbaru</div>
        <a class="see-all">Lihat Semua →</a>
      </div>
      <div id="recentGrid" class="anime-grid">${skeletonCards(6)}</div>
    </div>
    <div class="divider"></div>
    <div id="jadwal" class="section">
      <div class="section-header">
        <div class="section-title">📅 Jadwal Tayang Minggu Ini</div>
      </div>
      <div class="schedule-tabs" id="scheduleTabs"></div>
      <div id="scheduleList" class="schedule-list">
        ${'<div class="skeleton" style="height:100px;border-radius:10px;"></div>'.repeat(4)}
      </div>
    </div>`;
  loadTrending();
  loadRecent();
  loadSchedule();
}

function skeletonCards(n) {
  return '<div class="skeleton"><div class="skeleton-poster"></div><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>'.repeat(n);
}

function animeCard(a, badge) {
  const title = a.title?.romaji || 'Unknown';
  const cover = a.coverImage?.large || a.coverImage?.medium || '';
  const ep = a.nextAiringEpisode ? 'EP ' + a.nextAiringEpisode.episode : (a.episodes ? a.episodes + ' EP' : 'Ongoing');
  const genre = a.genres?.[0] || '';
  const b = badge || (a.averageScore >= 80 ? '<div class="card-badge hot">HOT</div>' : '<div class="card-badge">' + ep + '</div>');
  return `<div class="anime-card" onclick="goAnime(${a.id})">
    <div class="anime-poster">
      <img src="${cover}" alt="${escapeAttr(title)}" loading="lazy">
      ${b}
      <div class="anime-poster-overlay"><div class="play-btn">▶</div></div>
    </div>
    <div class="anime-info">
      <div class="anime-title">${escapeHtml(title)}</div>
      <div class="anime-meta"><span>${ep}</span><span>${escapeHtml(genre)}</span></div>
    </div></div>`;
}

function goAnime(id) { location.hash = '#/anime/' + id; }

async function loadTrending() {
  const q = `query($page:Int,$perPage:Int){Page(page:$page,perPage:$perPage){pageInfo{total}media(sort:TRENDING_DESC,type:ANIME,isAdult:false){id title{romaji}coverImage{large medium}genres episodes status averageScore}}}`;
  const d = await gql(q, { page: 1, perPage: 12 });
  const grid = document.getElementById('trendingGrid');
  if (!grid) return;
  if (!d) { grid.innerHTML = '<div class="error-box">Gagal memuat. Refresh halaman.</div>'; return; }
  const stat = document.getElementById('statTotal');
  if (stat) stat.textContent = (d.Page.pageInfo.total || 0).toLocaleString() + '+';
  grid.innerHTML = d.Page.media.map(a => animeCard(a, '<div class="card-badge hot">HOT</div>')).join('');
}

async function loadRecent() {
  const q = `query{Page(perPage:12){media(status:RELEASING,sort:UPDATED_AT_DESC,type:ANIME,isAdult:false){id title{romaji}coverImage{large medium}genres episodes nextAiringEpisode{episode}status averageScore}}}`;
  const d = await gql(q, {});
  const grid = document.getElementById('recentGrid');
  if (!grid) return;
  if (!d) { grid.innerHTML = '<div class="error-box">Gagal memuat.</div>'; return; }
  grid.innerHTML = d.Page.media.map(a => animeCard(a, '<div class="card-badge new">NEW</div>')).join('');
}

async function loadSchedule() {
  const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
  const today = new Date().getDay();
  const tabs = document.getElementById('scheduleTabs');
  if (!tabs) return;
  tabs.innerHTML = days.map((d, i) => '<button class="tab-btn' + (i === today ? ' active' : '') + '" onclick="switchDay(' + i + ')">' + d + (i === today ? ' ★' : '') + '</button>').join('');
  const q = `query($gt:Int,$lt:Int){Page(perPage:25){airingSchedules(airingAt_greater:$gt,airingAt_lesser:$lt,sort:TIME){airingAt episode media{id title{romaji}coverImage{medium}isAdult}}}}`;
  const now = new Date();
  for (let i = 0; i < 7; i++) {
    const d = new Date(now);
    d.setDate(d.getDate() - today + i);
    d.setHours(0, 0, 0, 0);
    const start = Math.floor(d.getTime() / 1000);
    const end = start + 86399;
    const data = await gql(q, { gt: start, lt: end });
    scheduleData[i] = data ? data.Page.airingSchedules.filter(s => !s.media.isAdult) : [];
  }
  renderSchedule(today);
}

function switchDay(i) {
  document.querySelectorAll('.tab-btn').forEach((b, idx) => b.classList.toggle('active', idx === i));
  renderSchedule(i);
}

function renderSchedule(i) {
  const items = scheduleData[i] || [];
  const el = document.getElementById('scheduleList');
  if (!el) return;
  if (!items.length) { el.innerHTML = '<div class="error-box">Tidak ada jadwal untuk hari ini.</div>'; return; }
  const now = Math.floor(Date.now() / 1000);
  el.innerHTML = items.map(s => {
    const aired = s.airingAt < now;
    const t = new Date(s.airingAt * 1000).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + ' WIB';
    return `<div class="schedule-item" onclick="goAnime(${s.media.id})">
      <div class="sched-thumb"><img src="${s.media.coverImage?.medium || ''}" loading="lazy"></div>
      <div class="sched-info">
        <div class="sched-title">${escapeHtml(s.media.title.romaji)}</div>
        <div class="sched-ep">Episode ${s.episode}</div>
        <div class="sched-time">🕐 ${t}</div>
      </div>
      <div class="sched-status ${aired ? 'done">✓ Tayang' : 'soon">Segera'}</div>
    </div>`;
  }).join('');
}

function buildEpGrid(n) {

  for (let i = 1; i <= n; i++) {
    html += `<div class="ep-cell${i === currentEp ? ' active' : ''}" onclick="jumpEp(${i})">${i}</div>`;
  }
  return html;
}

function toggleDesc() {
  const a = currentAnime; if (!a) return;
  const desc = (a.description || '').replace(/<[^>]*>/g, '');
  const box = document.getElementById('descBox');
  const tog = document.getElementById('descToggle');
  if (!box || !tog) return;
  if (tog.dataset.open === '1') {
    box.textContent = desc.slice(0, 320) + '…';
    tog.textContent = 'Lihat selengkapnya ▾';
    tog.dataset.open = '0';
  } else {
    box.textContent = desc;
    tog.textContent = 'Lebih sedikit ▴';
    tog.dataset.open = '1';
  }
}

function updateNavBtns() {
  const a = currentAnime; if (!a) return;
  const p = document.getElementById('prevBtn');
  const n = document.getElementById('nextBtn');
  if (p) p.disabled = currentEp <= 1;
  if (n) n.disabled = a.episodes && currentEp >= a.episodes;
  document.querySelectorAll('#epGrid .ep-cell').forEach((c, i) => c.classList.toggle('active', (i + 1) === currentEp));
  const inp = document.getElementById('epInput');
  if (inp) inp.value = currentEp;
}

function setSourceBtnActive(src) {
  document.querySelectorAll('.src-btn').forEach(b => b.classList.toggle('active', b.dataset.src === src));
}

function setSourceBtnState(src, state) {
  const btn = document.querySelector(`.src-btn[data-src="${src}"]`);
  if (!btn) return;
  btn.classList.remove('success', 'fail');
  if (state) btn.classList.add(state);
}

function setSource(src) {
  currentSource = src;
  setSourceBtnActive(src);
  loadEpisode(currentEp);
}

function changeEp(dir) {
  const a = currentAnime; if (!a) return;
  const next = currentEp + dir;
  if (next < 1) return;
  if (a.episodes && next > a.episodes) return;
  jumpEp(next);
}

function jumpEp(val) {
  const n = parseInt(val) || 1;
  currentEp = n;
  sessionStorage.setItem('ep_' + currentAnime.id, String(n));
  updateNavBtns();
  loadEpisode(n);
}

function destroyPlayer() {
  if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
}

function setPlayerStatus(html) {
  const f = document.getElementById('playerFrame');
  if (f) f.innerHTML = `<div class="player-status">${html}</div>`;
}

function setPlayerVideo(streamUrl) {
  destroyPlayer();
  const f = document.getElementById('playerFrame');
  if (!f) return;
  f.innerHTML = `<video id="vid" controls playsinline crossorigin="anonymous" poster="${currentAnime?.coverImage?.large || ''}"></video>`;
  const v = document.getElementById('vid');
  if (streamUrl.includes('.m3u8') && window.Hls && Hls.isSupported()) {
    hls = new Hls({ enableWorker: true, lowLatencyMode: false });
    hls.loadSource(streamUrl);
    hls.attachMedia(v);
    hls.on(Hls.Events.ERROR, (_e, data) => {
      if (data.fatal) {
        console.warn('HLS fatal', data);
      }
    });
  } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
    v.src = streamUrl;
  } else {
    v.src = streamUrl;
  }
}

function setPlayerIframe(url) {
  destroyPlayer();
  const f = document.getElementById('playerFrame');
  if (!f) return;
  f.innerHTML = `<iframe src="${url}" allowfullscreen allow="autoplay; fullscreen; picture-in-picture; encrypted-media" referrerpolicy="unsafe-url" loading="lazy"></iframe>`;
}

/* ─── IFRAME PROVIDERS ─── */
function iframeUrl(provider, mal, anilistId, ep) {
  switch (provider) {
    // GogoAnime via Consumet embed — AniList ID based
    case 'gogoanime': return `https://gogoanime3.co/category/${anilistId}-episode-${ep}`;
    // vidsrc.me — permissive X-Frame headers, MAL ID based
    case 'vidsrc':    return `https://vidsrc.me/embed/anime?mal=${mal}&episode=${ep}`;
    // AniWave embed — uses MAL ID
    case 'aniwave':   return `https://aniwave.to/watch/${mal}.${ep}`;
    // AnimeFox / AniCDN — MAL based
    case 'animefox':  return `https://embed.anicdn.top/anime/${mal}/ep/${ep}`;
  }
  return '';
}

/* ─── SCRAPER 1: Consumet → GogoAnime HLS ─── */
const CONSUMET_HOSTS = [
  'https://consumet-api-puce.vercel.app',
  'https://api.consumet.org',
  'https://anime-api-rouge.vercel.app',
];

async function consumetFetch(path) {
  let lastErr;
  for (const h of CONSUMET_HOSTS) {
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 9000);
      const r = await fetch(h + path, { signal: ctrl.signal });
      clearTimeout(t);
      if (!r.ok) { lastErr = new Error('HTTP ' + r.status); continue; }
      return await r.json();
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('Consumet unreachable');
}

async function tryConsumet(title, ep) {
  const s = await consumetFetch(`/anime/gogoanime/${encodeURIComponent(title)}`);
  const results = s.results || [];
  if (!results.length) throw new Error('No result on consumet');
  const pick = results.find(r => !/\(dub\)/i.test(r.title || '')) || results[0];
  const info = await consumetFetch(`/anime/gogoanime/info/${encodeURIComponent(pick.id)}`);
  const episodes = info.episodes || [];
  if (!episodes.length) throw new Error('No episodes');
  const target = episodes.find(e => Number(e.number) === Number(ep)) || episodes[ep - 1] || episodes[0];
  if (!target) throw new Error('Episode not found');
  const w = await consumetFetch(`/anime/gogoanime/watch/${encodeURIComponent(target.id)}`);
  const sources = w.sources || [];
  if (!sources.length) throw new Error('No stream sources');
  const best = sources.find(x => /m3u8/i.test(x.url) && /default|auto|1080|720/i.test(x.quality || ''))
            || sources.find(x => /m3u8/i.test(x.url))
            || sources[0];
  return { url: best.url };
}

/* ─── SCRAPER 2: Samehadaku (sub Indo) ─── */
async function trySamehadaku(title, ep) {
  const base = 'https://samehadaku.email';
  const sRes = await proxiedFetch(`${base}/?s=${encodeURIComponent(title)}`);
  const sDoc = new DOMParser().parseFromString(await sRes.text(), 'text/html');
  const animeLink = sDoc.querySelector('.animposx a, .listupd article a, h2.entry-title a, .animepost a');
  if (!animeLink) throw new Error('Tidak ditemukan di Samehadaku');
  const aRes = await proxiedFetch(animeLink.getAttribute('href'));
  const aDoc = new DOMParser().parseFromString(await aRes.text(), 'text/html');
  const epLinks = Array.from(aDoc.querySelectorAll('.lstepsiode a, .episodelist a, .eplister a'))
    .map(a => ({ href: a.getAttribute('href'), text: (a.textContent || '').trim() }));
  if (!epLinks.length) throw new Error('Episode list tidak terbaca');
  let pick = epLinks.find(l => new RegExp('(^|\\D)' + ep + '(\\D|$)').test(l.text));
  if (!pick) pick = epLinks[epLinks.length - ep] || epLinks[0];
  const eRes = await proxiedFetch(pick.href);
  const eDoc = new DOMParser().parseFromString(await eRes.text(), 'text/html');
  const iframe = eDoc.querySelector('#pembed iframe, .player-embed iframe, iframe[src*="http"]');
  if (!iframe) throw new Error('Iframe video tidak ditemukan');
  let src = iframe.getAttribute('src');
  if (src && src.startsWith('//')) src = 'https:' + src;
  if (!src) throw new Error('Src kosong');
  return { iframe: src };
}

/* ─── AUTO + MANUAL episode loader ─── */
async function loadEpisode(ep) {
  destroyPlayer();
  const a = currentAnime; if (!a) return;
  currentEp = ep;
  updateNavBtns();
  document.querySelectorAll('.src-btn').forEach(b => b.classList.remove('success', 'fail'));

  const title = a.title.romaji || a.title.english || '';

  if (currentSource === 'auto') {
    // Step 1: Try Consumet HLS (best quality, no ads)
    setPlayerStatus(`<div class="spinner"></div><div>🌐 Mencoba GogoAnime HLS…</div>`);
    try {
      const c = await tryConsumet(title, ep);
      setSourceBtnState('gogoanime', 'success');
      setPlayerVideo(c.url);
      return;
    } catch (e) {
      console.warn('Consumet gagal:', e.message);
      setSourceBtnState('gogoanime', 'fail');
    }
    // Step 2: Try Samehadaku (sub Indo)
    setPlayerStatus(`<div class="spinner"></div><div>🇮🇩 Mencoba Samehadaku…</div>`);
    try {
      const s = await trySamehadaku(title, ep);
      setSourceBtnState('samehadaku', 'success');
      setPlayerIframe(s.iframe);
      return;
    } catch (e) {
      console.warn('Samehadaku gagal:', e.message);
      setSourceBtnState('samehadaku', 'fail');
    }
    // Step 3: VidSrc.me embed — permissive X-Frame, MAL ID based
    if (a.idMal) {
      setSourceBtnState('vidsrc', 'success');
      setPlayerIframe(iframeUrl('vidsrc', a.idMal, a.id, ep));
      return;
    }
    setPlayerStatus(`<div class="icon">😵</div><div>Semua sumber gagal.<br><span style="font-size:.78rem;">Coba ganti sumber manual di atas.</span></div>`);
    return;
  }

  // MANUAL: gogoanime
  if (currentSource === 'gogoanime') {
    setPlayerStatus(`<div class="spinner"></div><div>Memuat GogoAnime…</div>`);
    try {
      const c = await tryConsumet(title, ep);
      setSourceBtnState('gogoanime', 'success');
      setPlayerVideo(c.url);
    } catch (e) {
      setSourceBtnState('gogoanime', 'fail');
      setPlayerStatus(`<div class="icon">⚠️</div><div>GogoAnime gagal: ${escapeHtml(e.message)}<br><span style="font-size:.75rem;">Coba sumber lain.</span></div>`);
    }
    return;
  }
  // MANUAL: samehadaku
  if (currentSource === 'samehadaku') {
    setPlayerStatus(`<div class="spinner"></div><div>Scraping Samehadaku…</div>`);
    try {
      const s = await trySamehadaku(title, ep);
      setSourceBtnState('samehadaku', 'success');
      setPlayerIframe(s.iframe);
    } catch (e) {
      setSourceBtnState('samehadaku', 'fail');
      setPlayerStatus(`<div class="icon">⚠️</div><div>Samehadaku gagal: ${escapeHtml(e.message)}<br><span style="font-size:.75rem;">Coba sumber lain.</span></div>`);
    }
    return;
  }
  // MANUAL: iframe providers (need MAL ID)
  if (!a.idMal) {
    setPlayerStatus(`<div class="icon">🔍</div><div>Sumber ini butuh MAL ID.<br><span style="font-size:.75rem;">Pakai GogoAnime atau Samehadaku.</span></div>`);
    return;
  }
  setSourceBtnState(currentSource, 'success');
  setPlayerIframe(iframeUrl(currentSource, a.idMal, a.id, ep));
}

/* =========================================================
   HELPERS
   ========================================================= */
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

/* boot */
render();
</script>
